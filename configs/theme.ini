# ==============================================================================
# ProxPXE - Configuração Visual e Tema Editável (.ini)
# Tema Claro: Branco e Azul (Padrão Hospital Regional Menino Jesus)
# Qualquer pessoa pode editar este arquivo para mudar cores, textos e resolução!
# ==============================================================================

[branding]
app_name = "ProxPXE"
organization = "Hospital Regional Menino Jesus"
subtitle = "Servidor de Boot de Rede PXE"
logo_file = "logo.png"
background_file = "background.png"

[font]
font_family = "Outfit"
font_size = 14
font_file = "Outfit.pf2"

[colors]
# Paleta de Cores Hospitalar (Claro: Branco e Azul)
bg_color = "#f8fafc"
card_bg = "#ffffff"
primary_blue = "#0284c7"
primary_dark_blue = "#0369a1"
accent_blue = "#38bdf8"
light_blue_bg = "#f0f9ff"
text_color = "#0f172a"
text_muted = "#64748b"
border_color = "#e2e8f0"

[grub_menu]
# Parâmetros da Tela de Boot do Ventoy (GRUB2)
resolution = "1920x1080"
timeout = 15
item_color = "#334155"
selected_item_color = "#ffffff"
selected_bg_color = "#0284c7"
hotkey_color = "#64748b"
EOF
