# Proxmox PXE - Nginx Configuration (Pure Bash Stack)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/pxe-server/web;
    index index.html;

    client_max_body_size 50G;

    # Otimizações de streaming de rede para ISOs
    sendfile on;
    sendfile_max_chunk 2m;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75;

    # Painel Web
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ISOs em /data/iso (Streaming de Boot, Download e Upload via WebDAV)
    location /iso/ {
        alias /data/iso/;
        autoindex on;
        autoindex_exact_size off;
        add_header Accept-Ranges bytes;
        dav_methods PUT DELETE MKCOL COPY MOVE;
        create_full_put_path on;
        dav_access user:rw group:rw all:r;
        client_max_body_size 50G;
    }

    # Arquivos de kernel extraídos
    location /extracted/ {
        alias /data/extracted/;
        autoindex on;
    }

    # Tema Ventoy, Logos, Papel de Parede e Fontes
    location /theme/ {
        alias /data/theme/;
        autoindex on;
    }

    # Fallback estático para lista de ISOs caso fcgiwrap esteja inativo
    location = /api/isos {
        alias /data/config/isos.json;
        default_type application/json;
    }

    # API em Bash CGI via fcgiwrap
    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/pxe-server/scripts/pxe-api.sh;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_pass unix:/var/run/fcgiwrap.socket;
    }
}
