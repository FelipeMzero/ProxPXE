# Proxmox PXE - Nginx Configuration (Pure Bash Stack)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/pxe-server/web;
    index index.html;

    client_max_body_size 50G;

    # Otimizações de streaming de rede para ISOs (estilo iVentoy)
    sendfile on;
    sendfile_max_chunk 2m;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75;
    aio threads;

    # Painel Web
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ISOs locais em /data/iso (Streaming de Boot, Download e Upload)
    location /iso/ {
        alias /data/iso/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_format html;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "no-cache";
        client_max_body_size 50G;
    }

    # ISOs compartilhadas do Proxmox em /data/proxmox-iso (Streaming de Boot)
    location /proxmox-iso/ {
        alias /data/proxmox-iso/;
        autoindex on;
        autoindex_exact_size off;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "no-cache";
    }

    # Arquivos de kernel extraídos (para boot rápido HTTP estilo iVentoy)
    location /extracted/ {
        alias /data/extracted/;
        autoindex on;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "no-cache";
    }

    # Tema Ventoy, Logos, Papel de Parede e Fontes
    location /theme/ {
        alias /data/theme/;
        autoindex on;
        add_header Cache-Control "max-age=3600";
    }

    # Binários BIOS (lpxelinux.0, undionly.kpxe, memdisk, .c32 modules)
    # Servidos via HTTP para acesso do GRUB2, iPXE e chain loading
    location /bios/ {
        alias /var/lib/tftpboot/bios/;
        autoindex on;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "no-cache";
    }

    # Binários UEFI (grubnetx64.efi, ipxe.efi, wimboot)
    location /uefi/ {
        alias /var/lib/tftpboot/uefi/;
        autoindex on;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "no-cache";
    }

    # Grub modules e configuração (para chainload)
    location /grub/ {
        alias /var/lib/tftpboot/grub/;
        autoindex on;
        add_header Accept-Ranges bytes;
    }

    # Arquivos de Boot Memdisk via HTTP (acesso direto)
    location = /memdisk {
        alias /var/lib/tftpboot/memdisk;
        add_header Accept-Ranges bytes;
    }

    # Wimboot para instaladores Windows via iPXE
    location = /wimboot {
        alias /var/lib/tftpboot/wimboot;
        add_header Accept-Ranges bytes;
    }

    # Menu iPXE via HTTP (iVentoy style)
    location = /menu.ipxe {
        alias /var/lib/tftpboot/menu.ipxe;
        default_type text/plain;
        add_header Cache-Control "no-cache";
    }

    # Upload de ISOs via POST multipart
    location /upload/ {
        alias /data/iso/;
        client_max_body_size 50G;
        dav_methods PUT;
        create_full_put_path on;
        dav_access user:rw group:rw all:r;
    }

    # Fallback estático para lista de ISOs caso fcgiwrap esteja inativo
    location = /api/isos {
        alias /data/config/isos.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    # Informações de status do sistema
    location = /api/status-static {
        alias /data/config/status.json;
        default_type application/json;
    }

    # API em Bash CGI via fcgiwrap
    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/pxe-server/scripts/pxe-api.sh;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_pass unix:/var/run/fcgiwrap.socket;
        fastcgi_read_timeout 300;
    }

    # Suporte a CORS para requisições cross-origin do painel web
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Session-Token" always;
}
