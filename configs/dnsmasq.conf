# ====================================================
# PROXPXE - CONFIGURAÇÃO DO DNSMASQ (MODO PROXYDHCP)
# ====================================================

# Desativa serviço DNS para evitar conflito na porta 53
port=0

# Ativa servidor TFTP interno de alta velocidade (tftp-secure desativado para evitar bloqueio)
enable-tftp
tftp-root=/var/lib/tftpboot
tftp-max=100

# Registro de logs de DHCP e TFTP
log-dhcp
log-facility=/var/log/dnsmasq.log

# ====================================================
# CONFIGURAÇÃO DINÂMICA DA REDE (AUTO-DETECTADA)
# ====================================================
# O script pxe-network.sh detecta a rede real do container
# (seja IP estático ou DHCP, /24, /16, etc.) e substitui
# automaticamente a linha dhcp-range com a subnet e máscara da sua rede:
#
# Exemplo 1: dhcp-range=10.50.0.0,proxy,255.255.0.0
# Exemplo 2: dhcp-range=172.16.10.0,proxy,255.255.255.0
# Exemplo 3: dhcp-range=192.168.15.0,proxy,255.255.255.0
#
dhcp-range=127.0.0.1,proxy

# Detecção de Arquitetura do Cliente (Option 93 / Client Architecture)
# 0: Standard PC BIOS (Legacy)
dhcp-match=set:bios,option:client-arch,0

# 6: EFI IA32 (32-bit UEFI)
dhcp-match=set:efi-ia32,option:client-arch,6

# 7: EFI BC (x86-64 UEFI)
dhcp-match=set:efi-x64,option:client-arch,7

# 9: EFI x86-64 (Modern UEFI)
dhcp-match=set:efi-x64,option:client-arch,9

# 11: EFI ARM64
dhcp-match=set:efi-arm64,option:client-arch,11

# Arquivo de inicialização de acordo com a arquitetura detectada
dhcp-boot=tag:bios,bios/lpxelinux.0
dhcp-boot=tag:efi-ia32,uefi/grubnetia32.efi
dhcp-boot=tag:efi-x64,uefi/grubnetx64.efi

# Serviços PXE anunciados aos clientes
pxe-prompt="Pressione F8 ou aguarde para Iniciar ProxPXE...", 2
pxe-service=tag:bios,x86PC,"ProxPXE (BIOS Legacy)",bios/lpxelinux.0
pxe-service=tag:efi-x64,X86-64_EFI,"ProxPXE (UEFI 64-bit)",uefi/grubnetx64.efi
pxe-service=tag:efi-ia32,IA32_EFI,"ProxPXE (UEFI 32-bit)",uefi/grubnetia32.efi
